<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: relativer Pfad damit GitHub Pages (/<repo>/) korrekt funktioniert -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Viewport: kein User-Zoom, exakte Gerätegröße, Safe-Area für iOS Notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Theme -->
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="background-color" content="#1a1a2e" />

    <!-- iOS PWA: Vollbild ohne Safari-Chrome beim Hinzufügen zum Homescreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spielewelt" />

    <!-- iOS Icons: relativer Pfad -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Beschreibung -->
    <meta name="description" content="Spielewelt — Multi-Game Plattform als PWA" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Spielewelt</title>

    <!-- Inline-Styles für Lade- und Fehler-Anzeige (kein externes CSS nötig) -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: #1a1a2e;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Lade-Bildschirm — sichtbar bis React den #root übernimmt */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #1a1a2e;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-icon {
        font-size: 64px;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .loading-title {
        font-size: 22px;
        font-weight: 900;
        color: #FFD700;
        letter-spacing: 2px;
        font-family: 'Arial Black', Impact, sans-serif;
        text-shadow: 2px 2px 0 #4a2c0a;
      }

      .loading-dots {
        display: flex;
        gap: 8px;
      }

      .loading-dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6c3fc5;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) { animation-delay: 0.2s; background: #3a86ff; }
      .loading-dots span:nth-child(3) { animation-delay: 0.4s; background: #e63946; }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-12px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50%       { opacity: 1;   transform: scale(1.2); }
      }

      /* noscript-Meldung wenn JavaScript deaktiviert ist */
      .noscript-box {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1a1a2e;
        padding: 32px;
        text-align: center;
      }

      .noscript-box h1 {
        font-size: 28px;
        color: #FFD700;
        font-family: 'Arial Black', sans-serif;
      }

      .noscript-box p {
        font-size: 16px;
        color: rgba(255,255,255,0.65);
        max-width: 380px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>

    <!-- Lade-Bildschirm: wird von main.tsx ausgeblendet sobald React bereit ist -->
    <div id="app-loading">
      <div class="loading-icon">🎮</div>
      <div class="loading-title">SPIELEWELT</div>
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- React-Root -->
    <div id="root"></div>

    <!-- Fallback wenn JavaScript deaktiviert oder blockiert ist -->
    <noscript>
      <div class="noscript-box">
        <div style="font-size:64px">🎮</div>
        <h1>Spielewelt</h1>
        <p>
          Diese App benötigt JavaScript.<br/>
          Bitte aktiviere JavaScript in deinem Browser und lade die Seite neu.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
