services:
  super-jumper:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: super-jumper:latest
    container_name: super-jumper
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
