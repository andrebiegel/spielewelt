server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection "1; mode=block"    always;
    add_header Referrer-Policy "strict-origin"     always;

    # Service Worker: never cache, always revalidate
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Workbox runtime chunks: same as SW
    location ~* workbox-.*\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Web App Manifest: short cache
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { application/manifest+json webmanifest; }
    }

    # Hashed JS/CSS assets: immutable long-term cache
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images and fonts: long cache
    location ~* \.(?:png|ico|svg|woff2|woff|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Healthcheck endpoint (no file needed)
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA fallback: all unknown routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
